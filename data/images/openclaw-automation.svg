<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" rx="20" fill="#1c1c1c"/>
    <!-- Circuit Lines -->
    <path d="M0 100 L100 100 L150 50 M0 300 L200 300 L250 350 M600 150 L500 150 L450 100" stroke="#333" stroke-width="2" fill="none"/>
    <!-- Mechanical Claw -->
    <path d="M250 100 L350 100 L350 150 M300 100 L300 80" stroke="#888" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M280 150 L250 200 M320 150 L350 200" stroke="#888" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Telegram Plane -->
    <path d="M300 180 L360 210 L330 220 L320 250 L300 220 L270 230 Z" fill="#0088cc"/>
    <!-- Hacker Gear -->
    <circle cx="450" cy="280" r="40" fill="none" stroke="#555" stroke-width="8" stroke-dasharray="20,10"/>
    <text x="300" y="340" font-family="Arial, sans-serif" font-size="28" fill="#888" text-anchor="middle" font-weight="bold">Automation Hacker</text>
</svg>